name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: Run example suite (must exit 0)
        run: trajence run examples/refund_agent.py --html report.html --json report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trajence-report
          path: report.html
