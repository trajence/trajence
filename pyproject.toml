[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajence"
version = "0.1.0"
description = "Trajectory testing, invariant assertions, and deterministic replay for AI agents in CI/CD."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
trajence = "trajence.cli.main:main"

[tool.setuptools.packages.find]
include = ["trajence*"]
